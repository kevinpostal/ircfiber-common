name: Common version guard

# This library ships as three byte-identical copies (this repo, site/common,
# engine/common). Landing a source change without bumping the version leaves
# the copies claiming one version with different content — the failure mode
# that let db/user.d drift unnoticed. So: source changed => version bumped.

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'dub.sdl'
  pull_request:
    paths:
      - 'source/**'
      - 'dub.sdl'

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version is present and semver
        run: |
          set -euo pipefail
          grep -qE '^version "[0-9]+\.[0-9]+\.[0-9]+"' dub.sdl \
            || { echo "::error file=dub.sdl::version missing or not semver"; exit 1; }
          echo "version: $(sed -nE 's/^version "(.*)"/\1/p' dub.sdl)"

      - name: Version bumped when source changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD -- source | wc -l | tr -d ' ')
          if [ "$changed" -eq 0 ]; then
            echo "no source/ changes — nothing to bump"
            exit 0
          fi
          old=$(git show "$base:dub.sdl" | sed -nE 's/^version "(.*)"/\1/p')
          new=$(sed -nE 's/^version "(.*)"/\1/p' dub.sdl)
          echo "source/ files changed: $changed — version $old -> $new"
          if [ "$old" = "$new" ]; then
            echo "::error file=dub.sdl::source/ changed but version stayed $new — bump it, then re-sync the mirrors with site/scripts/sync-common.sh"
            exit 1
          fi

      - name: Tag exists for this version
        run: |
          ver=$(sed -nE 's/^version "(.*)"/\1/p' dub.sdl)
          git tag --list | grep -qx "common-v$ver" \
            || echo "::warning file=dub.sdl::no tag for $ver — create with: git tag common-v$ver && git push origin common-v$ver"
